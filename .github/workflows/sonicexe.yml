name: Sonic.EXE Folder Release

on:
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo (shallow)
        uses: actions/checkout@v3
        with:
          fetch-depth: 1

      - name: Enable sparse checkout
        run: |
          git sparse-checkout init --cone
          git sparse-checkout set sonic.exe

      - name: Commit sonic.exe-only tree
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "actions@github.com"
          git add .
          git commit -m "Keep only sonic.exe folder" || echo "No changes to commit"

      - name: Push to sonic.exe-only branch
        run: |
          git push origin HEAD:sonic.exe-only

      - name: Zip sonic.exe folder
        run: zip -r sonic.exe.zip sonic.exe

      - name: Create release with zip
        uses: softprops/action-gh-release@v1
        with:
          tag_name: sonic.exe-v1.0
          name: Sonic.EXE Folder Release
          body: |
            This release contains only the `sonic.exe` folder from the original repo.
          files: sonic.exe.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
